<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2a1245">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Truth or Dare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#2a1245; --bg2:#6b2d8b; --bg3:#8e24aa;
  --pill:#8e24aa; --pill-hi:#b039d3;
  --ink:#ffffff; --ink-dim:rgba(255,255,255,.65);
  --panel:#ffffff; --panel-ink:#1c1023; --panel-dim:#b9b0c2;
  --gold:#ffd166; --pink:#ff7bac; --green:#5be584; --red:#ff5c5c;
  --l1:#57c7ff; --l2:#5be584; --l3:#b6e34d; --l4:#ffd166; --l5:#ffa94d; --l6:#ff7b54; --l7:#ff5c5c; --l8:#e5383b; --l9:#a4133c; --l10:#6a040f;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{height:100%;}
body{
  margin:0; font-family:'Nunito',sans-serif; color:var(--ink);
  background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
  overflow:hidden; position:fixed; inset:0;
}
/* party bokeh */
.bokeh{position:fixed; inset:0; pointer-events:none; z-index:0;}
.bokeh span{position:absolute; border-radius:50%; filter:blur(18px); opacity:.35;
  animation:float 9s ease-in-out infinite alternate;}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-26px)}}
@media (prefers-reduced-motion:reduce){.bokeh span{animation:none}}

h1,h2,.display{font-family:'Baloo 2',cursive; letter-spacing:.5px;}
.screen{position:fixed; inset:0; display:none; flex-direction:column; align-items:center;
  justify-content:center; padding:24px; z-index:1; overflow:hidden;}
.screen.active{display:flex;}
.title{font-size:clamp(30px,6vw,52px); font-weight:800; text-align:center; margin:0 0 28px;
  text-shadow:0 3px 14px rgba(0,0,0,.35);}

/* ---------- top bar ---------- */
.topbar{position:fixed; top:0; left:0; right:0; display:flex; align-items:center;
  justify-content:space-between; padding:14px 18px; z-index:5;}
.iconbtn{background:rgba(255,255,255,.14); border:none; color:#fff; width:46px; height:46px;
  border-radius:50%; font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
.iconbtn:active{transform:scale(.92);}

/* ---------- pills / buttons ---------- */
.pillrow{display:flex; gap:18px; align-items:center; justify-content:center; flex-wrap:wrap;}
.numpill{width:74px; height:74px; border-radius:50%; border:none; cursor:pointer;
  background:var(--pill); color:#fff; font-family:'Baloo 2'; font-size:30px; font-weight:800;
  box-shadow:0 6px 0 rgba(0,0,0,.25); transition:transform .12s;}
.numpill:active{transform:translateY(3px);}
.numpill.sel{background:#fff; color:var(--pill); transform:scale(1.15);}
.bigbtn{border:none; cursor:pointer; background:#fff; color:var(--pill);
  font-family:'Baloo 2'; font-weight:800; font-size:clamp(22px,5.4vw,32px); padding:clamp(14px,2.4vh,20px) clamp(34px,8vw,54px);
  border-radius:44px; box-shadow:0 6px 0 rgba(0,0,0,.25); margin-top:34px;}
.bigbtn:active{transform:translateY(3px);}
.bigbtn:disabled{opacity:.4;}
.bigbtn.alt{background:rgba(255,255,255,.16); color:#fff; box-shadow:0 6px 0 rgba(0,0,0,.35);
  border:3px solid rgba(255,255,255,.65);}
.btnrow{display:flex; gap:16px; align-items:center;}
.btnrow .bigbtn{margin-top:26px;}
.ghostbtn{border:2px solid rgba(255,255,255,.5); background:transparent; color:#fff;
  font-family:'Baloo 2'; font-weight:700; font-size:17px; padding:10px 24px; border-radius:30px; cursor:pointer;}

/* ---------- gender toggle ---------- */
.gtoggle{display:flex; gap:14px; margin-bottom:26px;}
.gtoggle button{border:none; cursor:pointer; padding:12px 34px; border-radius:34px;
  font-family:'Baloo 2'; font-weight:800; font-size:20px; background:rgba(255,255,255,.16); color:#fff;}
.gtoggle button.sel{background:#fff; color:var(--pill);}

/* ---------- face grid ---------- */
.facegrid{display:grid; grid-template-columns:repeat(5,1fr); gap:14px; max-width:640px; width:100%;}
@media(max-width:520px){.facegrid{grid-template-columns:repeat(3,1fr); gap:10px;}}
.faceopt{background:rgba(255,255,255,.12); border:3px solid transparent; border-radius:22px;
  padding:8px; cursor:pointer; transition:transform .12s;}
.faceopt:active{transform:scale(.94);}
.faceopt.sel{border-color:var(--gold); background:rgba(255,255,255,.24);}
.faceopt svg{display:block; width:100%; height:auto;}
.taken{opacity:.28; pointer-events:none;}

/* ---------- orbiting wheel ---------- */
.wheelwrap{position:relative; width:min(86vw,60vh,460px); aspect-ratio:1; margin-top:20px;
  --seat:clamp(74px,18vw,104px);}
.pointer{position:absolute; top:calc(var(--seat)*-0.5); left:50%; transform:translateX(-50%); z-index:5;
  width:0; height:0; border-left:18px solid transparent; border-right:18px solid transparent;
  border-top:28px solid var(--gold); filter:drop-shadow(0 3px 4px rgba(0,0,0,.45));}
.ring{position:absolute; inset:0; will-change:transform;}
.seat{position:absolute; left:50%; top:50%; width:var(--seat); height:var(--seat);
  margin:calc(var(--seat)/-2); border-radius:50%; background:rgba(0,0,0,.34);
  padding:5px; border:4px solid rgba(255,255,255,.4);}
.seat svg,.bigface svg{width:100%;height:100%;display:block;}
.seat.winner{border-color:var(--gold);
  box-shadow:0 0 0 6px rgba(255,209,102,.4),0 0 30px var(--gold);}
.gobtn{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:38%; aspect-ratio:1;
  border-radius:50%; border:6px solid #fff; background:rgba(255,255,255,.16); color:#fff;
  font-family:'Baloo 2'; font-weight:800; font-size:clamp(26px,7vw,42px); cursor:pointer; z-index:3;
  backdrop-filter:blur(2px); text-shadow:0 2px 8px rgba(0,0,0,.4); box-shadow:0 6px 20px rgba(0,0,0,.3);}
.gobtn:active{transform:translate(-50%,-50%) scale(.94);}
.gobtn:disabled{opacity:.6;}

/* ---------- difficulty ---------- */
.lvlbtn{border:none; cursor:pointer; font-family:'Baloo 2'; font-weight:800;
  font-size:clamp(15px,2.6vw,20px); padding:11px 26px; border-radius:28px; color:#1c1023;
  box-shadow:0 4px 0 rgba(0,0,0,.25);}
.lvlbtn:active{transform:translateY(2px);}
.lvlgroup{display:flex; align-items:center; gap:10px;}
.arrowbtn{background:rgba(255,255,255,.16); border:none; color:#fff; width:46px; height:46px; border-radius:50%; font-family:'Baloo 2'; font-weight:800; font-size:34px; line-height:1; padding:0 0 4px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
.arrowbtn:active{transform:scale(.92);}
.lv-1{background:var(--l1);} .lv-2{background:var(--l2);} .lv-3{background:var(--l3);} .lv-4{background:var(--l4);} .lv-5{background:var(--l5);} .lv-6{background:var(--l6);} .lv-7{background:var(--l7); color:#fff!important;} .lv-8{background:var(--l8); color:#fff!important;} .lv-9{background:var(--l9); color:#fff!important;} .lv-10{background:var(--l10); color:#fff!important;}
.levelgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; width:min(92vw,460px);}
.levelbig{display:block; width:100%; border:none; cursor:pointer;
  font-family:'Baloo 2'; font-weight:800; font-size:clamp(17px,4.2vw,23px); padding:clamp(12px,2.3vh,19px) 6px;
  border-radius:20px; color:#1c1023; box-shadow:0 5px 0 rgba(0,0,0,.28); transition:transform .12s;}
.levelbig:active{transform:translateY(4px);}
.levelbig.sel{outline:5px solid #fff; outline-offset:-2px;}
#screen-level .title{margin-bottom:8px; font-size:clamp(26px,6vw,40px);}
.levelbig{font-size:clamp(28px,6.4vw,38px);}
.iconbtn-spacer{width:46px; height:46px;}
.menulist{display:flex; flex-direction:column; gap:16px; width:min(86vw,440px);}
.menubtn{border:none; cursor:pointer; background:#fff; color:var(--pill); font-family:'Baloo 2'; font-weight:800; font-size:clamp(26px,6vw,36px); padding:clamp(20px,3.4vh,30px) 20px; border-radius:30px; box-shadow:0 7px 0 rgba(0,0,0,.28);}
.menubtn:active{transform:translateY(4px);}
#screen-howto{justify-content:flex-start; align-items:center; padding:76px 0 40px; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.howwrap{width:min(94vw,640px); display:flex; flex-direction:column; align-items:stretch; padding-bottom:30px;}
.howwrap .title{margin:0 0 14px; text-align:center;}
.howh{font-family:'Baloo 2'; font-weight:800; font-size:24px; margin:14px 0 6px;}
.howp{font-weight:700; font-size:16px; line-height:1.45; color:rgba(255,255,255,.9); margin:0 0 12px;}
.howp.small{font-size:14px; opacity:.85;}
.lvlist{display:flex; flex-direction:column; gap:8px; margin:6px 0 12px;}
.lvrow{display:flex; align-items:center; gap:12px; background:rgba(255,255,255,.12); border-radius:16px; padding:10px 14px;}
.lvnum{flex:none; width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Baloo 2'; font-weight:800; font-size:22px; color:#1c1023;}
.lvbody{flex:1; min-width:0;}
.lvname{font-family:'Baloo 2'; font-weight:800; font-size:20px; line-height:1.1;}
.lvadds{font-weight:700; font-size:14px; opacity:.9; line-height:1.3;}
.lvcount{flex:none; text-align:center; font-family:'Baloo 2'; line-height:1; min-width:58px;}
.lvcount b{display:block; font-size:24px;}
.lvcount span{font-size:12px; opacity:.8; font-weight:700;}
.lvfield{display:flex; align-items:center; gap:8px; font-weight:800;}

/* ---------- turn screen ---------- */
.turnhead{display:flex; flex-direction:column; align-items:center; gap:6px; margin-bottom:14px;}
.bigface{width:clamp(120px,26vw,180px); aspect-ratio:1; border-radius:50%; background:#1c1023; padding:10px;
  border:5px solid var(--gold); box-shadow:0 8px 30px rgba(0,0,0,.4);}
.turnlabel{font-family:'Baloo 2'; font-weight:800; font-size:22px;}
.slotpanel{background:var(--panel); color:var(--panel-ink); width:min(90vw,460px);
  border-radius:26px; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,.35); touch-action:none;}
.slotrow{padding:clamp(18px,3.4vh,30px) 10px; text-align:center; font-family:'Baloo 2'; font-weight:800;
  font-size:clamp(38px,9vw,54px); color:#6b6175; cursor:pointer; transition:all .18s;}
.slotrow.sel{color:var(--panel-ink); font-size:clamp(46px,11vw,66px); background:#f6f2fa;}
.slot-or{font-size:20px; letter-spacing:3px; color:#8a7f95; padding:4px; cursor:default;
  border-top:1px solid #eee; border-bottom:1px solid #eee;}
.hint{margin-top:14px; color:var(--ink-dim); font-size:15px; font-weight:700;}
.verlabel{position:fixed; top:64px; left:22px; z-index:6; font-family:'Baloo 2'; font-weight:800;
  font-size:13px; color:rgba(255,255,255,.7); letter-spacing:.5px; pointer-events:none;}
.inlineface{display:inline-block; width:1.05em; height:1.05em; vertical-align:-.2em; margin-right:.12em;}
.inlineface svg{width:100%;height:100%;display:block;}

/* ---------- card ---------- */
#screen-card{justify-content:center; gap:0;}
.card{background:var(--panel); color:var(--panel-ink); width:min(92vw,600px);
  min-height:38vh; border-radius:32px; padding:clamp(28px,5vw,48px); box-shadow:0 12px 40px rgba(0,0,0,.35);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; text-align:center;
  margin:18px 0;}
.cardtext{font-family:'Baloo 2'; font-weight:800; font-size:clamp(28px,6vw,44px); line-height:1.28;
  display:block; width:100%;}
.timerbtn{border:none; cursor:pointer; background:var(--pill); color:#fff; font-family:'Baloo 2';
  font-weight:800; font-size:24px; padding:14px 40px; border-radius:34px; box-shadow:0 5px 0 rgba(0,0,0,.2);}
.timerbig{font-family:'Baloo 2'; font-weight:800; font-size:clamp(64px,16vw,110px); color:var(--pill);}
.timerbig.urgent{color:var(--red); animation:blink .5s steps(2) infinite;}
@keyframes blink{50%{opacity:.35}}

/* ---------- editor ---------- */
#screen-editor{justify-content:flex-start; padding-top:80px; overflow:hidden;}
.edtools{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:12px;}
.chip{border:none; cursor:pointer; font-weight:800; font-size:14px; padding:7px 16px;
  border-radius:20px; background:rgba(255,255,255,.16); color:#fff;}
.chip.sel{background:#fff; color:var(--pill);}
.edlist{flex:1; width:min(94vw,640px); overflow-y:auto; -webkit-overflow-scrolling:touch;
  display:flex; flex-direction:column; gap:10px; padding-bottom:110px;}
.edrow{background:rgba(255,255,255,.12); border-radius:16px; padding:12px 14px; display:flex;
  gap:10px; align-items:center;}
.edrow .txt{flex:1; font-weight:700; font-size:15px; line-height:1.35;}
.badge{font-family:'Baloo 2'; font-weight:800; font-size:11px; padding:3px 9px; border-radius:12px; color:#1c1023;}
.badge.T{background:var(--pink); color:#fff;} .badge.D{background:#c77dff; color:#fff;}
.badge.tm{background:rgba(255,255,255,.85);}
.edrow button{background:none; border:none; color:#fff; font-size:18px; cursor:pointer; opacity:.8;}
.edactions{position:fixed; bottom:0; left:0; right:0; display:flex; gap:10px; justify-content:center;
  padding:16px; background:linear-gradient(transparent,rgba(26,10,44,.9) 40%); z-index:6;}
.edactions button{font-family:'Baloo 2'; font-weight:800; border:none; border-radius:26px;
  padding:12px 20px; font-size:16px; cursor:pointer;}
.addbtn{background:var(--gold); color:#1c1023;} .iobtn{background:rgba(255,255,255,.2); color:#fff;}

/* edit modal */
.modal{position:fixed; inset:0; background:rgba(10,4,20,.7); display:none; align-items:center;
  justify-content:center; z-index:20; padding:20px;}
.modal.open{display:flex;}
.modalbox{background:#fff; color:var(--panel-ink); border-radius:22px; padding:22px;
  width:min(92vw,480px); display:flex; flex-direction:column; gap:14px;}
.modalbox textarea{font-family:'Nunito'; font-weight:700; font-size:16px; border:2px solid #e2d8ec;
  border-radius:14px; padding:12px; resize:vertical; min-height:84px; user-select:text;}
.modalrow{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.seg{display:flex; border-radius:14px; overflow:hidden; border:2px solid #e2d8ec;}
.seg{flex-wrap:wrap;}
.seg button{border:none; background:#fff; padding:8px 11px; font-weight:800; font-size:14px; cursor:pointer; color:#8a7f95;}
.seg button.sel{background:var(--pill); color:#fff;}
.modalbox input[type=number]{width:80px; font-weight:800; font-size:16px; padding:8px;
  border:2px solid #e2d8ec; border-radius:12px; user-select:text;}
.modalactions{display:flex; gap:10px; justify-content:flex-end;}
.modalactions button{font-family:'Baloo 2'; font-weight:800; border:none; border-radius:20px;
  padding:10px 22px; font-size:16px; cursor:pointer;}
.savebtn{background:var(--pill); color:#fff;} .cancelbtn{background:#eee;}

.toast{position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px);
  background:#1c1023; color:#fff; font-weight:800; padding:12px 22px; border-radius:26px;
  opacity:0; transition:all .3s; z-index:30; pointer-events:none; max-width:86vw; text-align:center;}
.toast.show{opacity:1; transform:translateX(-50%);}
</style>
</head>
<body>
<div class="bokeh" id="bokeh"></div>

<div class="topbar">
  <button class="iconbtn" id="menuBtn" title="Menu" aria-label="Menu">&#9776;</button>
  <div class="verlabel" id="verLabel"></div>
  <div class="lvlgroup" id="levelGroup">
    <button class="arrowbtn" id="lvlPrev" aria-label="Easier level">&#8249;</button>
    <button class="lvlbtn" id="levelBtn">Easy</button>
    <button class="arrowbtn" id="lvlNext" aria-label="Harder level">&#8250;</button>
  </div>
  <div class="iconbtn-spacer"></div>
</div>

<!-- 1. player count -->
<section class="screen active" id="screen-count">
  <h1 class="title">How many players?</h1>
  <div class="pillrow" id="countPills"></div>
  <button class="bigbtn" id="countNext">Next</button>
</section>

<!-- 2. face pick -->
<section class="screen" id="screen-face">
  <h1 class="title" id="faceTitle">Player 1, choose your face</h1>
  <div class="gtoggle">
    <button data-g="M">Man</button>
    <button data-g="F">Woman</button>
  </div>
  <div class="facegrid" id="faceGrid"></div>
  <button class="bigbtn" id="faceNext" disabled>Next</button>
</section>

<!-- 3. wheel (orbiting ring) -->
<section class="screen" id="screen-wheel">
  <div class="wheelwrap">
    <div class="pointer"></div>
    <div class="ring" id="ring"></div>
    <button class="gobtn" id="goBtn">Spin</button>
  </div>
</section>

<!-- difficulty page -->
<section class="screen" id="screen-level">
  <h1 class="title">Difficulty</h1>
  <div class="levelgrid">
  <button class="levelbig lv-1" data-l="1">1</button>
  <button class="levelbig lv-2" data-l="2">2</button>
  <button class="levelbig lv-3" data-l="3">3</button>
  <button class="levelbig lv-4" data-l="4">4</button>
  <button class="levelbig lv-5" data-l="5">5</button>
  <button class="levelbig lv-6" data-l="6">6</button>
  <button class="levelbig lv-7" data-l="7">7</button>
  <button class="levelbig lv-8" data-l="8">8</button>
  <button class="levelbig lv-9" data-l="9">9</button>
  <button class="levelbig lv-10" data-l="10">10</button>
  </div>
</section>

<!-- main menu -->
<section class="screen" id="screen-menu">
  <h1 class="title">Menu</h1>
  <div class="menulist">
    <button class="menubtn" id="menuNew">Start a new game</button>
    <button class="menubtn" id="menuHow">How to play</button>
    <button class="menubtn" id="menuEdit">Edit the dares</button>
  </div>
</section>

<!-- how to play -->
<section class="screen" id="screen-howto">
  <div class="howwrap" id="howBody"></div>
</section>

<!-- 4. turn: pick truth/dare -->
<section class="screen" id="screen-turn">
  <div class="turnhead">
    <div class="bigface" id="turnFace"></div>
  </div>
  <div class="slotpanel" id="slotPanel">
    <div class="slotrow" data-t="TRUTH" id="rowTruth">Truth</div>
    <div class="slotrow sel" data-t="DARE" id="rowDare">Dare</div>
  </div>
</section>

<!-- 5. card -->
<section class="screen" id="screen-card">
  <div class="turnhead">
    <div class="bigface" id="cardFace"></div>
  </div>
  <div class="card">
    <div class="cardtext" id="cardText"></div>
    <div id="timerZone"></div>
  </div>
  <div class="btnrow">
    <button class="bigbtn alt" id="tryBtn">Punishment</button>
    <button class="bigbtn" id="doneBtn">Done</button>
  </div>
</section>

<!-- editor -->
<section class="screen" id="screen-editor">
  <h1 class="title" style="font-size:30px;margin-bottom:10px">Truths &amp; Dares</h1>
  <div class="edtools" id="edFilters"></div>
  <div class="edlist" id="edList"></div>
  <div class="edactions">
    <button class="addbtn" id="addItem">＋ Add</button>
    <button class="iobtn" id="exportBtn">Export .txt</button>
    <button class="iobtn" id="importBtn">Import</button>
    <button class="iobtn" id="resetBtn">Reset</button>
    <button class="iobtn" id="edDone">Done</button>
  </div>
  <input type="file" id="importFile" accept=".txt,.csv,.tsv,text/plain,text/csv,text/tab-separated-values" style="display:none">
</section>

<div class="modal" id="editModal">
  <div class="modalbox">
    <textarea id="mText" placeholder="Write the truth or dare..."></textarea>
    <div class="modalrow">
      <div class="seg" id="mType">
        <button data-v="TRUTH">Truth</button><button data-v="DARE" class="sel">Dare</button>
      </div>
      <label class="lvfield">Level <input type="number" id="mLevel" min="1" max="10.9" step="0.1" placeholder="4.5"></label>
    </div>
    <div class="modalrow">
      <label style="font-weight:800">Timer (sec, optional)</label>
      <input type="number" id="mTimer" min="0" max="600" placeholder="0">
    </div>
    <div class="modalactions">
      <button class="cancelbtn" id="mCancel">Cancel</button>
      <button class="savebtn" id="mSave">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================= FACES ============================= */
/* ============================= FACES v2 ============================= */

  const N=state.level+d;
  if(N<1||N>LEVEL_MAX) return;
  state.level=N; renderLevelBtn(); uiTap();
  if($('screen-card').classList.contains('active')) drawCard(state.original?state.original.type:state.choice,true);
}
$('lvlPrev').onclick=()=>stepLevel(-1);
$('lvlNext').onclick=()=>stepLevel(1);
$('levelBtn').onclick=()=>{ uiTap();
  levelReturn=document.querySelector('.screen.active').id;
  renderLevelBtn(); show('screen-level'); };
document.querySelectorAll('.levelbig').forEach(b=>b.onclick=()=>{
  state.level=parseInt(b.dataset.l,10); renderLevelBtn(); uiTap();
  show(levelReturn);
  if(levelReturn==='screen-card') drawCard(state.original?state.original.type:state.choice,true);
});
renderLevelBtn();

/* ============================= SETUP: COUNT ============================= */
(function(){const row=$('countPills');
 for(let n=2;n<=5;n++){const b=document.createElement('button');b.className='numpill'+(n===2?' sel':'');
  b.textContent=n;b.onclick=()=>{state.count=n;row.querySelectorAll('.numpill').forEach(x=>x.classList.toggle('sel',+x.textContent===n));uiTap();};
  row.appendChild(b);}})();

/* ============================= SETUP: FACES ============================= */
let pickGender='M', pickFace=null;
function startFacePick(){
  pickGender='M';pickFace=null;
  $('faceTitle').textContent=`Player ${state.setupIdx+1}, choose your face`;
  document.querySelectorAll('.gtoggle button').forEach(b=>b.classList.toggle('sel',b.dataset.g==='M'));

  renderFaceGrid(); show('screen-face');
}
document.querySelectorAll('.gtoggle button').forEach(b=>b.onclick=()=>{

  document.querySelectorAll('.gtoggle button').forEach(x=>x.classList.toggle('sel',x===b));

});
function renderFaceGrid(){
  const grid=$('faceGrid'); grid.innerHTML='';
  for(let i=0;i<FACES[pickGender].length;i++){
    const d=document.createElement('div');

    d.onclick=()=>{pickFace=i;uiTap();$('faceNext').disabled=false;

$('faceNext').onclick=()=>{

  else buildWheel();
};

/* ============================= ORBITING WHEEL ============================= */
let spinning=false, ringAngle=0;
function buildWheel(){
  const ring=$('ring'); ring.innerHTML='';
  state.players.forEach((p,i)=>{
    const seat=document.createElement('div');
    seat.className='seat'; seat.id='seat'+i;
    seat.innerHTML=faceSVG(p.g,p.f);
    ring.appendChild(seat);
  });
  ringAngle=0;
  show('screen-wheel');
  // CRITICAL: the wheel must be VISIBLE before measuring, or clientWidth is 0
  // and every face collapses to the centre. Lay out on the next frame.
  requestAnimationFrame(()=>{ requestAnimationFrame(layoutSeats); });
}
function seatRadius(){
  const wrap=document.querySelector('.wheelwrap');
  const seatEl=$('seat0');
  const seatSz=seatEl?seatEl.offsetWidth:90;
  return (wrap.clientWidth/2)-(seatSz/2)-6;
}
function layoutSeats(){
  const wrap=document.querySelector('.wheelwrap'); if(!wrap||!wrap.clientWidth)return;
  const r=seatRadius(), n=state.players.length;
  state.players.forEach((p,i)=>{
    const seat=$('seat'+i); if(!seat)return;
    const a=((360/n)*i-90)*Math.PI/180;   // seat 0 at top
    seat.dataset.tx=Math.cos(a)*r; seat.dataset.ty=Math.sin(a)*r;
    seat.style.transform=`translate(${seat.dataset.tx}px,${seat.dataset.ty}px)`;
  });
  applyRing();
}
function applyRing(){
  $('ring').style.transform=`rotate(${ringAngle}deg)`;
  state.players.forEach((p,i)=>{ const s=$('seat'+i); if(!s)return;
    const svg=s.querySelector('svg'); if(svg) svg.style.transform=`rotate(${-ringAngle}deg)`;
  });
}
window.addEventListener('resize',()=>{ if($('screen-wheel').classList.contains('active')) layoutSeats(); });

$('goBtn').onclick=()=>{ if(spinning)return; spinWheel(); };
function spinWheel(){
  spinning=true; uiTap();
  document.querySelectorAll('.seat').forEach(s=>s.classList.remove('winner'));
  const n=state.players.length;
  const winner=Math.floor(Math.random()*n);
  const seg=360/n;
  // land so winner (base angle seg*winner-90) rests at the top pointer (-90)
  const targetMod=((-(seg*winner))%360+360)%360;
  const curMod=((ringAngle%360)+360)%360;
  let delta=targetMod-curMod; if(delta<0)delta+=360;
  const total=360*(4+Math.floor(Math.random()*3))+delta;   // several full turns
  const start=ringAngle, dur=3200+Math.random()*700, t0=performance.now();
  let lastSeg=-1;
  function frame(now){
    const t=Math.min(1,(now-t0)/dur);
    const ease=1-Math.pow(1-t,3);
    ringAngle=start+total*ease;
    applyRing();
    const segIdx=Math.floor((((ringAngle-90)%360)+360)%360/seg);
    if(segIdx!==lastSeg){ spinTick(1); lastSeg=segIdx; }
    if(t<1) requestAnimationFrame(frame);
    else{
      ringAngle=start+total; applyRing();
      spinning=false; state.current=winner;
      $('seat'+winner).classList.add('winner');
      winSound();
      setTimeout(()=>{ if(document.querySelector('.screen.active').id==='screen-wheel') openTurn(); else { prepTurn(); menuReturn='screen-turn'; } },1000);
    }
  }
  requestAnimationFrame(frame);
}

/* ============================= TURN ============================= */
function prepTurn(){
  const p=state.players[state.current];
  $('turnFace').innerHTML=faceSVG(p.g,p.f);
  setChoice('DARE');
}
function openTurn(){ prepTurn(); show('screen-turn'); }
function setChoice(c){

/* swipe on slot panel */
(function(){let y0=null;const p=$('slotPanel');
 p.addEventListener('touchstart',e=>{y0=e.touches[0].clientY;},{passive:true});
 p.addEventListener('touchend',e=>{ if(y0===null)return;
   const dy=e.changedTouches[0].clientY-y0; y0=null;

/* ============================= CARD ============================= */
let countdown=null;
const EMOJI_RE=/(👨|👩|😏)/;
function performerGender(text){
  const m=text.match(EMOJI_RE);
  if(!m) return null;                 // no tag = anyone
  return m[1]==='👨'?'M':(m[1]==='👩'?'F':null);   // 😏 = anyone
}
function faceSpan(p){ return `<span class="inlineface">${faceSVG(p.g,p.f)}</span>`; }
/* replace opening emoji with the current player's face, inline emojis with target faces */
function renderDareText(text){
  const cur=state.players[state.current];
  if(!EMOJI_RE.test(text)) return faceSpan(cur)+escapeHtml(text);
  const others=state.players.filter((p,i)=>i!==state.current);
  const chosen={};
  function target(g){
    const key=g||'any';
    if(chosen[key]) return chosen[key];
    let pool=g?others.filter(p=>p.g===g):others.slice();
    if(!pool.length) pool=others.slice();
    const t=pool.length?pool[Math.floor(Math.random()*pool.length)]:cur;
    chosen[key]=t; return t;
  }
  let first=true, html='';
  for(const part of text.split(/(👨|👩|😏)/)){
    if(part==='👨'||part==='👩'||part==='😏'){
      if(first){ first=false; html+=faceSpan(cur); }
      else html+=faceSpan(target(part==='👨'?'M':(part==='👩'?'F':null)));
    } else html+=escapeHtml(part);
  }
  return html;
}
const TRUTH_CAP=3;        // truths: levels 1-3 use the matching truth tier; level 4 and up draws from every truth
const LADDER_WINDOW=0.3;  // dares in a level are served lowest score first, shuffled within this window
function pickItem(type,N){
  const cg=state.players[state.current]?state.players[state.current].g:null;
  const capped = type==='TRUTH' && N>TRUTH_CAP;
  const bucket = capped ? 'ALL' : String(N);
  const matches=it=> it.type===type && (capped ? true : lvlOf(it.level)===N);
  const genderOk=it=>{const pg=performerGender(it.text); return !pg||pg===cg;};
  const eligible=items.filter(it=>matches(it)&&genderOk(it));
  let used=usedSet(type,bucket);
  let pool=eligible.filter(it=>!used.includes(it.id));
  if(!pool.length && eligible.length){
    // every eligible item has been shown: start a fresh round for this level,
    // but keep the most recent one benched so it cannot come straight back
    const ids=new Set(eligible.map(it=>it.id));
    const last=used.filter(id=>ids.has(id)).pop();
    state.used[bucketKey(type,bucket)]=used.filter(id=>!ids.has(id)).concat(eligible.length>1&&last?[last]:[]);
    used=usedSet(type,bucket);
    pool=eligible.filter(it=>!used.includes(it.id));
    toast(capped?'All truths used, shuffling fresh':`All level ${N} ${type.toLowerCase()}s used, shuffling fresh`);
  }
  if(!pool.length) pool=items.filter(matches);   // last resort: ignore gender rather than show nothing
  if(!pool.length) return null;
  let cand=pool;
  if(type==='DARE'){
    const sorted=pool.slice().sort((a,b)=>a.level-b.level);
    const lim=sorted[0].level+LADDER_WINDOW+1e-9;
    cand=sorted.filter(it=>it.level<=lim);
    if(cand.length<3) cand=sorted.slice(0,Math.min(3,sorted.length));
  }
  const it=cand[randInt(cand.length)];
  usedSet(type,bucket).push(it.id);
  saveUsed();
  try{renderLevelBtn();}catch(e){}
  return it;
}
function renderCard(type,it){
  state.choice=type;
  const p=state.players[state.current];
  $('cardFace').innerHTML=faceSVG(p.g,p.f);
  if(!it){ $('cardText').innerHTML=`Nothing at level ${state.level} for ${type.toLowerCase()}s yet. Add some from the menu under Edit the dares.`; $('timerZone').innerHTML=''; return; }
  $('cardText').innerHTML=renderDareText(it.text);
  $('timerZone').innerHTML= it.timer>0 ? `<button class="timerbtn" id="startTimer">▶ &nbsp;${it.timer}s</button>` : '';
  if(it.timer>0) $('startTimer').onclick=()=>runCountdown(it.timer);
}
function drawCard(type,keepScreen){
  stopCountdown();
  const it=pickItem(type,state.level);
  state.cardItem=it;
  // this is the ORIGINAL draw; remember it so Punishment can return
  state.original={type,it};
  state.inPunishment=false;
  $('tryBtn').textContent='Punishment';
  renderCard(type,it);
  if(!keepScreen){ reveal(); show('screen-card'); } else { reveal(); }
}
/* Punishment toggles: draw a dare penalty, or go back to the original */
$('tryBtn').onclick=()=>{ uiTap(); stopCountdown();
  if(!state.inPunishment){
    const pen=pickItem('DARE',state.level);
    state.cardItem=pen; state.inPunishment=true;
    $('tryBtn').textContent='Back to original';
    renderCard('DARE',pen); reveal();
  } else {
    state.inPunishment=false;
    $('tryBtn').textContent='Punishment';
    state.cardItem=state.original.it;
    renderCard(state.original.type,state.original.it); reveal();
  }
};
function runCountdown(sec){
  stopCountdown(); uiTap();
  let left=sec;
  $('timerZone').innerHTML=`<div class="timerbig" id="tBig">${left}</div>`;
  countdown=setInterval(()=>{
    left--;
    const el=$('tBig'); if(!el){stopCountdown();return;}
    el.textContent=Math.max(0,left);
    if(left<=5&&left>0){el.classList.add('urgent');countTick();}
    if(left<=0){ stopCountdown(); el.textContent='Time!'; buzz(); }
  },1000);
}
function stopCountdown(){ if(countdown){clearInterval(countdown);countdown=null;} }
$('doneBtn').onclick=()=>{ uiTap(); stopCountdown(); buildWheel(); };

/* ============================= EDITOR ============================= */
let edType='ALL', edLevel='ALL', editing=null;
let menuReturn='screen-count';
function openMenu(){
  const cur=document.querySelector('.screen.active').id;
  if(!['screen-menu','screen-howto','screen-editor','screen-level'].includes(cur)) menuReturn=cur;
  show('screen-menu');
}
function closeMenu(){ show(menuReturn||'screen-count'); }
$('menuBtn').onclick=()=>{ uiTap(); if($('screen-menu').classList.contains('active')) closeMenu(); else openMenu(); };
$('menuNew').onclick=()=>{ uiTap(); stopCountdown(); show('screen-count'); };
$('menuHow').onclick=()=>{ uiTap(); renderHowTo(); show('screen-howto'); };
$('menuEdit').onclick=()=>{ uiTap(); renderEditor(); show('screen-editor'); };
$('edDone').onclick=()=>{ uiTap(); show('screen-menu'); };
function renderHowTo(){
  const per={}; items.forEach(it=>{ if(it.type==='DARE'){ const n=lvlOf(it.level); per[n]=(per[n]||0)+1; } });
  const tCount=items.filter(it=>it.type==='TRUTH').length;
  const rows=LEVELS.map(L=>`<div class="lvrow"><div class="lvnum lv-${L.n}">${L.n}</div><div class="lvbody"><div class="lvname">${L.name}</div><div class="lvadds">${escapeHtml(L.adds)}</div></div><div class="lvcount"><b>${per[L.n]||0}</b><span>rounds</span></div></div>`).join('');
  $('howBody').innerHTML=`<h1 class="title">How to play</h1>
    <h2 class="howh">Difficulty levels</h2>
    <p class="howp">Difficulty runs from 1 to 10. The arrows at the top move you one full level at a time. Every dare has its own decimal score inside its level, so the top shows where you stand, like <b>Easy 1.2</b>, <b>Medium 4.5</b> or <b>Hard 8.5</b>. Easy is the first third of the scale, Medium the middle third and Hard the last third. As the gentler dares in a level get used up, the number climbs.</p>
    <div class="lvlist">${rows}</div>
    <p class="howp small">The ten names above are potential level names. A round is one dare card, and a level reshuffles once all its dares have been used. Dares written for a man or a woman only come up for that player, so a round can be shorter than the count shown.</p>
    <h2 class="howh">Truths</h2>
    <p class="howp">Truths never get harder than level 3. Levels 1, 2 and 3 use the matching truth tier. From level 4 up, Truth draws from all ${tCount} truths.</p>
    <button class="bigbtn" id="howBack">Back</button>`;
  $('howBack').onclick=()=>{ uiTap(); show('screen-menu'); };
}

function renderEditor(){
  const f=$('edFilters');
  const chips=[['ALL','All'],['TRUTH','Truths'],['DARE','Dares']].map(([v,l])=>
    `<button class="chip ${edType===v?'sel':''}" data-k="type" data-v="${v}">${l}</button>`).join('')+
    [['ALL','All levels'],...Array.from({length:LEVEL_MAX},(_,i)=>[String(i+1),'Level '+(i+1)])].map(([v,l])=>
    `<button class="chip ${edLevel===v?'sel':''}" data-k="level" data-v="${v}">${l}</button>`).join('');
  f.innerHTML=chips;
  f.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    if(c.dataset.k==='type')edType=c.dataset.v; else edLevel=c.dataset.v;
    uiTap(); renderEditor();});
  const list=$('edList'); list.innerHTML='';
  const rows=items.filter(it=>(edType==='ALL'||it.type===edType)&&(edLevel==='ALL'||lvlOf(it.level)===+edLevel)).sort((a,b)=>a.level-b.level);
  if(!rows.length){list.innerHTML='<div style="opacity:.7;text-align:center;font-weight:700;padding:30px">Nothing here yet. Tap ＋ Add.</div>';}
  rows.forEach(it=>{
    const r=document.createElement('div'); r.className='edrow';
    r.innerHTML=`<span class="badge ${it.type[0]}">${it.type[0]}</span>
      <span class="badge lv-${lvlOf(it.level)}">${fmtScore(+it.level)}</span>
      ${it.timer>0?`<span class="badge tm">⏱${it.timer}s</span>`:''}
      <div class="txt">${escapeHtml(it.text)}</div>
      <button title="Edit">✎</button><button title="Delete">🗑</button>`;
    const [eb,db]=r.querySelectorAll('button');
    eb.onclick=()=>openModal(it);
    db.onclick=()=>{ items=items.filter(x=>x.id!==it.id); saveItems(); renderEditor(); toast('Deleted'); };
    list.appendChild(r);
  });
}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

$('addItem').onclick=()=>openModal(null);
function openModal(it){
  editing=it;
  $('mText').value=it?it.text:'';
  $('mTimer').value=it&&it.timer>0?it.timer:'';
  setSeg('mType',it?it.type:'DARE'); $('mLevel').value=it?it.level:state.level;
  $('editModal').classList.add('open'); $('mText').focus();
}
function setSeg(id,v){document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('sel',b.dataset.v===v));}
function getSeg(id){return document.querySelector('#'+id+' button.sel').dataset.v;}
document.querySelectorAll('.seg').forEach(seg=>seg.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return; setSeg(seg.id,b.dataset.v); uiTap();}));
$('mCancel').onclick=()=>$('editModal').classList.remove('open');
$('mSave').onclick=()=>{
  const text=$('mText').value.trim(); if(!text){toast('Write something first');return;}
  const timer=Math.max(0,parseInt($('mTimer').value||'0',10)||0);
  const type=getSeg('mType'); let level=parseFloat($('mLevel').value);
  if(!(level>=1&&level<LEVEL_MAX+1)){ toast('Level must be between 1 and 10.9'); return; }
  level=Math.round(level*100)/100;
  if(editing){Object.assign(editing,{text,timer,type,level});}
  else items.push({id:'u'+(uid++),text,timer,type,level});
  saveItems(); $('editModal').classList.remove('open'); renderEditor(); toast('Saved');
};

/* import / export */
$('exportBtn').onclick=()=>{
  const txt=items.map(it=>`${it.type} | ${it.level} | ${it.timer>0?it.timer+'s':''} | ${it.text}`).join('\n');
  const blob=new Blob([txt],{type:'text/plain'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='truth-or-dare-list.txt'; a.click(); URL.revokeObjectURL(a.href);
  toast('Exported truth-or-dare-list.txt');
};
$('importBtn').onclick=()=>$('importFile').click();
function parseCSVLine(line,delim){
  const out=[]; let cur=''; let q=false;
  for(let i=0;i<line.length;i++){const ch=line[i];
    if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else{ if(ch==='"') q=true; else if(ch===delim){out.push(cur);cur='';} else cur+=ch; }
  }
  out.push(cur); return out;
}
function parseImport(raw){
  const lines=String(raw).split(/\r?\n/).filter(l=>l.trim()!=='');
  const added=[]; let bad=0;
  if(!lines.length) return {added,bad};
  const sample=lines[0];
  const delim = sample.includes('|') ? '|' : (sample.includes('\t') ? '\t' : ',');
  let rows=lines.map(l=> delim==='|' ? l.split('|').map(s=>s.trim()) : parseCSVLine(l,delim).map(s=>s.trim()));
  let map={type:0,level:1,timer:2,text:3};
  const h=rows[0].map(c=>c.toLowerCase());
  const headerWords=['type','level','difficulty','timer','seconds','time','text','prompt','content','kind','truth or dare','truth/dare'];
  if(h.some(c=>headerWords.includes(c))){
    const find=(names,def)=>{const i=h.findIndex(c=>names.includes(c));return i>=0?i:def;};
    map={type:find(['type','kind','truth or dare','truth/dare'],0),
         level:find(['level','difficulty'],1),
         timer:find(['timer','seconds','time'],2),
         text:find(['text','prompt','content','description'],3)};
    rows=rows.slice(1);
  }
  rows.forEach(cols=>{
    const type=(cols[map.type]||'').toUpperCase();
    const lvRaw=(cols[map.level]||'').trim().toUpperCase();
    const lvAlias={MED:'MEDIUM',XTREME:'EXTREME',HC:'HARDCORE'};
    const level=/^\d+(\.\d+)?$/.test(lvRaw)?parseFloat(lvRaw):OLD_LEVEL[lvAlias[lvRaw]||lvRaw];
    const timer=parseInt(String(cols[map.timer]||'').replace(/[^0-9]/g,''),10)||0;
    let text=(cols[map.text]||'').trim();
    if(delim==='|') text=cols.slice(map.text).join(' | ').trim();
    if(!['TRUTH','DARE'].includes(type)||!(level>=1&&level<LEVEL_MAX+1)||!text){bad++;return;}
    added.push({type,level,timer,text});
  });
  return {added,bad};
}
$('importFile').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    const {added,bad}=parseImport(rd.result);
    if(!added.length){ toast('No valid items found in that file'); e.target.value=''; return; }
    const replace=confirm(`Found ${added.length} items.\n\nOK = REPLACE your whole list with this file\nCancel = ADD them to your current list`);
    if(replace){ items=[]; clearUsed(); }
    added.forEach(a=>items.push({id:'u'+(uid++),type:a.type,level:a.level,timer:a.timer,text:a.text}));
    saveItems(); renderEditor();
    toast(`${replace?'Replaced with':'Imported'} ${added.length} item${added.length===1?'':'s'}${bad?`, skipped ${bad} bad line${bad===1?'':'s'}`:''}`);
    e.target.value='';
  };
  rd.readAsText(f);
});
$('resetBtn').onclick=()=>{
  if(confirm('Reset to the built-in list of all truths and dares? Your own changes will be removed.')){
    items=JSON.parse(JSON.stringify(DEFAULT_ITEMS)); saveItems(); clearUsed(); renderEditor(); toast('Reset to built-ins');
  }
};

/* PWA */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
